# Workflow GitHub Actions : à CHAQUE push, build les distributeurs
# Windows (.exe) et Linux (.deb + AppImage) avec les icônes, better-sqlite3
# recompilé natif pour la plateforme cible et le rendu desktop re-fabriqué à
# partir du frontend le plus récent — donc chaque mise à jour est prise en
# compte. Les applications sont autonomes : le runtime Node est embarqué.
name: Build BlackTracker (Windows + Linux)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      # 1. Le code de l'app de bureau (ce repo) -> /workspace/desktop
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: desktop

      # 2. Le frontend le plus récent -> /workspace/frontend
      #    (dépôt du frontend ; le build desktop a besoin de ../frontend)
      - name: Checkout frontend (latest)
        uses: actions/checkout@v4
        with:
          repository: elvis-nak26code/track-performance-trading
          path: frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Fabrique le rendu desktop du frontend (vite mode desktop -> dist-desktop)
      - name: Build du rendu desktop (vite build:desktop -> dist-desktop)
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      # 4. Installe l'app desktop : electron + better-sqlite3 compilé POUR WINDOWS
      - name: Installation des dépendances desktop
        working-directory: desktop
        run: npm ci

      # 5. Runtime Node portable Windows (exécutable autonome : Node n'est pas
      #    requis sur la machine cible). Le binaire est téléchargé ici plutôt
      #    que commité dans le repo (82 Mo).
      - name: Télécharger le runtime Node portable (Windows)
        shell: pwsh
        run: |
          $node = "v22.23.2"
          $tmp = Join-Path $env:RUNNER_TEMP "node.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$node/node-$node-win-x64.zip" -OutFile $tmp
          Expand-Archive $tmp -DestinationPath (Join-Path $env:RUNNER_TEMP "node")
          New-Item -ItemType Directory -Force -Path "desktop/vendor/node-win-x64" | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "node\node-$node-win-x64\node.exe") "desktop/vendor/node-win-x64\node.exe"

      # 6. Génère l'installateur NSIS avec l'icône (desktop/build/icon.ico)
      - name: Build de l'exécutable Windows
        working-directory: desktop
        run: npx electron-builder --win nsis --x64

      # 7. Récupère l'exécutable généré (téléchargeable dans l'onglet Actions)
      - name: Upload de l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: BlackTracker-Windows-x64
          path: desktop/release/*Setup*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: desktop

      # Le frontend le plus récent -> /workspace/frontend
      - name: Checkout frontend (latest)
        uses: actions/checkout@v4
        with:
          repository: elvis-nak26code/track-performance-trading
          path: frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fabrique le rendu desktop (vite mode desktop -> dist-desktop)
      - name: Build du rendu desktop
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      # better-sqlite3 compilé pour Linux (ABI Node 24, identique au runtime embarqué)
      - name: Installation des dépendances desktop
        working-directory: desktop
        run: npm ci

      # Runtime Node portable Linux (Node v24.21.0, cf. ABI better-sqlite3 ci-dessus)
      - name: Télécharger le runtime Node portable (Linux)
        shell: bash
        run: |
          nodev="v24.21.0"
          mkdir -p desktop/vendor/node-linux-x64
          curl -sL "https://nodejs.org/dist/$nodev/node-$nodev-linux-x64.tar.xz" -o /tmp/node-linux.tar.xz
          tar -xf /tmp/node-linux.tar.xz -C /tmp "node-$nodev-linux-x64/bin/node"
          cp "/tmp/node-$nodev-linux-x64/bin/node" desktop/vendor/node-linux-x64/node

      # .deb + AppImage avec icône (menu des applications) + Node embarqué
      - name: Build Linux (.deb + AppImage)
        working-directory: desktop
        run: npx electron-builder --linux deb AppImage --x64

      - name: Upload .deb et AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BlackTracker-Linux-x64
          path: |
            desktop/release/*.deb
            desktop/release/*.AppImage
          if-no-files-found: error